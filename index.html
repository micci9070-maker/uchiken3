<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Google Maps表示テスト</title>
  <style>
    #map {
      width: 100%;
      height: 90vh;
    }
  </style>
</head>
<body>
  <h2>Google Mapsが表示されます</h2>
  <div id="map"></div>

  <script>
    function initMap() {
      const center = { lat: 36.64, lng: 136.63 }; // 内灘町付近の位置
      const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 14,
        center: center,
      });

      // 中心にマーカーをひとつ置く（動作確認用）
      new google.maps.Marker({
        position: center,
        map: map,
        title: "ここが内灘町",
      });
    }
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap"
    async
    defer
  ></script>
</body>
</html>
